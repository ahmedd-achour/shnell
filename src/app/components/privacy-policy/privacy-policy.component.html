<div class="mkt">

  <!-- Editorial header -->
  <header class="mkt-head">
    <div class="mkt-head__inner">
      <span class="sh-eyebrow">Shnell</span>
      <h1>{{ policy.title }}</h1>
      <nav class="mkt-head__crumb">
        <a routerLink="/">{{ lang === 'fr' ? 'Accueil' : 'Home' }}</a>
        <i class="fa fa-circle"></i>
        <span aria-current="page">{{ crumbLabel }}</span>
      </nav>
      <p class="pp-updated">{{ policy.updated }}</p>

      <div class="pp-langs" role="group" aria-label="Language">
        <button type="button" [class.on]="lang === 'fr'" (click)="setLang('fr')">Français</button>
        <button type="button" [class.on]="lang === 'en'" (click)="setLang('en')">English</button>
      </div>
    </div>
  </header>

  <main class="mkt-section">
    <div class="mkt-head__inner">
      <div class="mkt-prose pp-prose">
        <section class="pp-section" *ngFor="let s of policy.sections">
          <h2>{{ s.h }}</h2>
          <div [innerHTML]="toHtml(s)"></div>
        </section>

        <hr />
        <p class="pp-foot">{{ footerNote }}</p>
        <p class="pp-foot pp-foot--muted">
          Shnell Logistics — Tunis, Tunisie · <a href="mailto:support@shnell.com">support&#64;shnell.com</a>
        </p>
      </div>
    </div>
  </main>

</div>
