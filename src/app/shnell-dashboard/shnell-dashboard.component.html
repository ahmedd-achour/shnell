<div class="dashboard-root min-vh-100 position-relative" [attr.data-theme]="isDarkMode ? 'dark' : 'light'">
  <!-- Skeleton Loading Overlay -->
  <div class="loading-overlay d-flex flex-column align-items-center justify-content-center" *ngIf="loading">
    <div class="spinner-border text-brand mb-3" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
    <div class="loading-label mono tracking-wider text-brand fw-bold fs-7">SYNCHRONIZING FLEET PLATFORM DATA...</div>
  </div>

  <!-- Main Content -->
  <main class="dashboard-content-area flex-grow-1 p-0" *ngIf="!loading">
    
    <!-- Header with Stats -->
    <header class="dash-header mb-4 p-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="d-flex align-items-center gap-3">
        <div class="dash-header-icon"><i class="bi" [ngClass]="activeTabIcon"></i></div>
        <div>
          <h2 class="mb-0 font-heading fs-4">{{ activeTabLabel }}</h2>
          <small class="d-block fs-8">{{ today | date:'fullDate' }}</small>
        </div>
      </div>
      <div class="d-flex gap-3 align-items-center flex-wrap">
        <!-- Active Drivers Live Pill -->
        <div class="status-pill success px-3 py-2 d-flex align-items-center gap-2">
          <span class="pulse-ring"></span>
          <span class="fs-8 fw-bold mono">{{ activeDriversCount }} DRIVERS LIVE</span>
        </div>

        <!-- Things waiting for an admin: one click to the screen that clears them -->
        <button class="status-pill px-3 py-2 d-flex align-items-center gap-2 border-0" [ngClass]="criticalAlertsCount ? 'error' : openAlertsCount ? 'warning' : 'info'" (click)="setTab('alerts')">
          <i class="bi bi-bell-fill"></i>
          <span class="fs-8 fw-bold mono">{{ openAlertsCount }} OPEN ALERTS</span>
        </button>
        <button *ngIf="pendingRechargesCount" class="status-pill warning px-3 py-2 d-flex align-items-center gap-2 border-0" (click)="setTab('finance')">
          <i class="bi bi-shield-lock"></i>
          <span class="fs-8 fw-bold mono">{{ pendingRechargesCount }} RECHARGES TO APPROVE</span>
        </button>
        <button class="status-pill px-3 py-2 d-flex align-items-center gap-2 border-0" [ngClass]="pendingVehiclesCount ? 'warning' : 'info'" (click)="setTab('vehicles')">
          <i class="bi bi-truck"></i>
          <span class="fs-8 fw-bold mono">{{ pendingVehiclesCount }} VEHICLES TO REVIEW</span>
        </button>
      </div>
    </header>

    <!-- Error Banner -->
    <div class="alert alert-danger border-0 shadow-sm mb-4 rounded-3" *ngIf="error">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
    </div>

    <!-- Dynamic Active Component View -->
    <div class="dash-tab-viewport">
    <app-attention-strip
      *ngIf="activeTab === 'overview'"
      [users]="users"
      [vehicles]="vehicles"
      [verifications]="verifications"
      (navigateTab)="setTab($any($event))">
    </app-attention-strip>

    <app-overview-tab
      *ngIf="activeTab === 'overview'"
      [users]="users"
      [vehicles]="vehicles"
      [orders]="orders"
      [deals]="deals"
      [commissions]="commissions"
      [bids]="bids"
      (navigateTab)="setTab($any($event))"
      (inspectDriver)="onInspectDriver($event)"
      (selectUserForNotification)="onSelectUserForNotification($event)">
    </app-overview-tab>

    <app-users-tab
      *ngIf="activeTab === 'users'"
      [users]="users"
      [driverLocations]="driverLocations"
      (inspectDriver)="onInspectDriver($event)"
      (navigateTab)="setTab($any($event))"
      (selectUserForNotification)="onSelectUserForNotification($event)">
    </app-users-tab>

    <app-vehicles-tab
      *ngIf="activeTab === 'vehicles'"
      [vehicles]="vehicles"
      [users]="users"
      (inspectDriver)="onInspectDriver($event)">
    </app-vehicles-tab>

    <app-verifications-tab
      *ngIf="activeTab === 'verifications'"
      [verifications]="verifications"
      [users]="users">
    </app-verifications-tab>

    <app-deals-tab
      *ngIf="activeTab === 'deals'"
      [orders]="orders"
      [deals]="deals"
      [commissions]="commissions"
      [users]="users"
      [bids]="bids"
      [callLogs]="callLogs"
      [vehicles]="vehicles">
    </app-deals-tab>

    <app-live-map-tab
      *ngIf="activeTab === 'live-map'"
      [driverLocations]="driverLocations"
      [users]="users"
      [vehicles]="vehicles"
      (inspectDriver)="onInspectDriver($event)"
      (selectUserForNotification)="onSelectUserForNotification($event)">
    </app-live-map-tab>

    <app-account-tab
      *ngIf="activeTab === 'account'"
      [uid]="selectedAccountUid"
      [users]="users"
      (openAccount)="openAccount($event)"
      (notifyUser)="onSelectUserForNotification($event)">
    </app-account-tab>

    <app-finance-tab
      *ngIf="activeTab === 'finance'"
      [users]="users"
      (openAccount)="openAccount($event)">
    </app-finance-tab>

    <app-activity-tab
      *ngIf="activeTab === 'activity'"
      [users]="users"
      (openAccount)="openAccount($event)">
    </app-activity-tab>

    <app-alerts-tab
      *ngIf="activeTab === 'alerts'"
      [users]="users"
      (openAccount)="openAccount($event)"
      (navigateTab)="setTab($any($event))">
    </app-alerts-tab>

    <app-settings-tab
      *ngIf="activeTab === 'settings'">
    </app-settings-tab>

    <app-notifications-tab
      *ngIf="activeTab === 'notifications'"
      [users]="users"
      [preselectedUser]="selectedUserForNotification">
    </app-notifications-tab>

    <app-dispatch-order-tab
      *ngIf="activeTab === 'dispatch-order'"
      [users]="users"
      [vehicles]="vehicles"
      [driverLocations]="driverLocations"
      (navigateTab)="setTab($any($event))"
      (inspectDriver)="onInspectDriver($event)">
    </app-dispatch-order-tab>

    <app-dispatch-center-tab
      *ngIf="activeTab === 'dispatch-center'"
      [orders]="orders"
      [users]="users"
      [vehicles]="vehicles">
    </app-dispatch-center-tab>

    <app-assistant-tab
      *ngIf="activeTab === 'assistant'"
      (openAccount)="openAccount($event)">
    </app-assistant-tab>

    <app-api-access-tab
      *ngIf="activeTab === 'api'"
      [users]="users"
      (openAccount)="openAccount($event)">
    </app-api-access-tab>

    <app-business-requests-tab
      *ngIf="activeTab === 'business'"
      (openAccount)="openAccount($event)">
    </app-business-requests-tab>
    </div>
  </main>

  <!-- Live Cross-Tab Toast Alert -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100;" *ngIf="liveToastMessage">
    <div class="toast show align-items-center text-white bg-dark border border-brand rounded-4 shadow-lg p-2" role="alert">
      <div class="d-flex align-items-center">
        <div class="toast-body fs-7 fw-semibold">
          <i class="bi bi-broadcast text-warning me-2 fs-5"></i>
          {{ liveToastMessage }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="liveToastMessage = null"></button>
      </div>
    </div>
  </div>
</div>
