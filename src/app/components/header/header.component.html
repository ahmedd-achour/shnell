<!-- ============ MAIN NAV ============ -->
<header class="sh-nav" [class.is-scrolled]="scrolled">
  <div class="sh-nav__inner">
    <a routerLink="/home" class="sh-nav__brand" aria-label="Shnell — accueil">
      <img src="img/shnell.png" alt="Shnell" />
      <span>Shnell</span>
    </a>

    <nav class="sh-nav__links d-none d-lg-flex" aria-label="Navigation principale">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >{{ item.label }}</a>
    </nav>

    <div class="sh-nav__actions d-none d-lg-flex">
      <a routerLink="/sign-in" class="sh-btn sh-btn--ghost">Espace pro</a>
      <a href="https://play.google.com/store/apps/details?id=com.shnell.app"
         class="sh-btn sh-btn--primary" target="_blank" rel="noopener">
        <i class="fa-solid fa-download"></i> Télécharger l'app
      </a>
    </div>

    <button class="sh-nav__burger d-lg-none" (click)="toggleMenu()" aria-label="Ouvrir le menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ============ MOBILE PANEL ============ -->
<div class="sh-mobile" [class.open]="isMenuOpen">
  <div class="sh-mobile__head">
    <a routerLink="/home" class="sh-nav__brand" (click)="toggleMenu()">
      <img src="img/shnell.png" alt="Shnell" /><span>Shnell</span>
    </a>
    <button class="sh-mobile__close" (click)="toggleMenu()" aria-label="Fermer le menu">✕</button>
  </div>

  <nav class="sh-mobile__links">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="toggleMenu()"
    >{{ item.label }}</a>
  </nav>

  <div class="sh-mobile__cta">
    <a routerLink="/sign-in" class="sh-btn sh-btn--ghost sh-btn--block" (click)="toggleMenu()">Espace pro</a>
    <a href="https://play.google.com/store/apps/details?id=com.shnell.app"
       class="sh-btn sh-btn--primary sh-btn--block" target="_blank" rel="noopener">
      <i class="fa-solid fa-download"></i> Télécharger l'app
    </a>
  </div>
</div>

<div class="sh-mobile__backdrop" *ngIf="isMenuOpen" (click)="toggleMenu()"></div>
